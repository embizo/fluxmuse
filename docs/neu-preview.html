<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fluxmuse Neumorphic Soft UI – preview</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/modules/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="../assets/css/neu-soft-ui.css">
</head>
<body class="p-4">
<div class="container">
  <h2 class="mb-4">Soft UI components</h2>
  <div class="row">
    <div class="col-md-6 mb-4">
      <div class="card"><div class="card-header"><h4>Buttons</h4></div>
        <div class="card-body">
          <button class="btn btn-primary mr-2">Primary</button>
          <button class="btn btn-light mr-2">Light</button>
          <button class="btn btn-outline-primary mr-2">Outline</button>
          <span class="neu-circle">★</span>
        </div></div>
    </div>
    <div class="col-md-6 mb-4">
      <div class="card"><div class="card-header"><h4>Form</h4></div>
        <div class="card-body">
          <input class="form-control mb-3" placeholder="Inset text field">
          <select class="custom-select mb-3"><option>Select</option></select>
          <div class="custom-control custom-switch"><input type="checkbox" class="custom-control-input" id="s1" checked><label class="custom-control-label" for="s1">Auto-post</label></div>
          <div class="custom-control custom-checkbox mt-2"><input type="checkbox" class="custom-control-input" id="c1" checked><label class="custom-control-label" for="c1">Checkbox</label></div>
        </div></div>
    </div>
    <div class="col-md-6 mb-4">
      <div class="card"><div class="card-header"><h4>Tabs &amp; progress</h4></div>
        <div class="card-body">
          <ul class="nav nav-pills mb-3"><li class="nav-item"><a class="nav-link active" href="#">Active</a></li><li class="nav-item"><a class="nav-link" href="#">Idle</a></li></ul>
          <div class="progress mb-3"><div class="progress-bar bg-primary" style="width:62%"></div></div>
          <span class="badge badge-primary">Badge</span> <span class="badge badge-danger">Alert</span>
        </div></div>
    </div>
    <div class="col-md-6 mb-4">
      <div class="card"><div class="card-header"><h4>Table</h4></div>
        <div class="card-body p-0"><table class="table"><thead><tr><th>Channel</th><th>Posts</th></tr></thead>
        <tbody><tr><td>Instagram</td><td>24</td></tr><tr><td>Facebook</td><td>18</td></tr></tbody></table></div></div>
    </div>
  </div>
</div>
</body>
</html>
