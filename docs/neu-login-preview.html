<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fluxmuse soft-UI login preview</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/modules/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="../assets/modules/fontawesome/css/all.min.css">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/custom.css">
<link rel="stylesheet" href="../assets/css/neu-soft-ui.css">
<link rel="stylesheet" href="../assets/css/neu-auth.css">
</head>
<body class="bg-info-light-alt gradient neu-auth">
<div id="app"><section class="section"><div class="container mt-5">
  <div class="row"><div class="col-12 col-sm-8 offset-sm-2 col-lg-6 offset-lg-3">
    <div class="login-brand"><h3 style="margin:0">Fluxmuse</h3></div>
    <div class="card card-primary">
      <div class="card-header"><h4><i class="fas fa-sign-in-alt"></i> Login</h4></div>
      <div class="card-body">
        <form onsubmit="return false">
          <div class="form-group"><label class="control-label">Email</label><input type="text" class="form-control" value="you@example.com"></div>
          <div class="form-group"><div class="d-block"><label class="control-label">Password</label><div class="float-right"><a href="#" class="text-small">Forgot password?</a></div></div><input type="password" class="form-control" value="secret"></div>
          <div class="form-group"><button class="btn btn-primary btn-lg btn-block login_btn"><i class="fa fa-sign-in-alt"></i> Login</button></div>
        </form>
        <div class="row mb-3"><div class="col-12"><span id="customBtn"><span class="buttonText" style="padding:10px 16px">Sign in with Google</span></span></div></div>
        <div class="text-muted text-center">Don't have an account? <a href="#">Create one</a></div>
      </div>
    </div>
  </div></div>
</div></section></div>
</body>
</html>
